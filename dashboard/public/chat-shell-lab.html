<!doctype html><meta charset="utf-8">
<title>Chat Shell Lab — Header / Core / Footer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* REGION TONES. The three regions must be separable WITHOUT the debug outline.
   v1 had --hdr #121a2e against --panel #101827 — a tone step of ~1%, running the WRONG WAY (the chrome
   was LIGHTER than the reading surface), so the shell read as one flat slab. Now:
     CORE  = the reading surface, the LIGHTEST thing in the shell (content deserves the light)
   Measured: core #1a2440 vs chrome #080c18 = 1.27:1 surface contrast (was 1.03:1, and inverted).
     HEADER/FOOTER = chrome, clearly DARKER, so the eye reads "content" vs "controls" instantly
   plus a hard line and a 1px inner highlight at each seam, which is what actually makes an edge
   legible on a dark UI — a border alone disappears at low contrast. */
/* ===== TWO THEMES, ONE STRUCTURE =================================================================
   The regions, sizes and behaviour are identical; only the palette changes, so a workspace is
   recognisable at a glance without being a different UI.

   CORE  — "Midnight Violet": deep, cool, near-black chrome with a violet accent. The cockpit.
   PACT  — "Harbour Slate":  visibly LIGHTER slate surfaces with a teal accent. The workshop.

   INVARIANT: the P#/R# turn tags use the SAME two colours in both themes (blue P, violet R), because
   they are an addressing scheme, not decoration — if R# changed colour per workspace you could not
   learn it once. They are declared OUTSIDE the theme blocks for exactly that reason. */
:root{
  --tag-p-bg:#1b4fc4; --tag-p-fg:#dbe6ff;      /* P# — blue, right corner  (matches production) */
  --tag-r-bg:#c77dff; --tag-r-fg:#1a0a1e;      /* R# — violet, left corner (matches production) */
  --ok:#3ddc97;--warn:#ffb454;--err:#ff6b81;
}
body[data-theme="core"]{
  --bg:#05080f;--panel:#1a2440;--panel2:#0d1226;--line:#22304a;--ink:#e7ecff;--dim:#9aa6c7;
  --acc:#c77dff;--hdr:#080c18;--ftr:#080c18;--seam:#33436b;
  --bub-a:#121b30;--bub-a-line:#ffffff1a;--bub-u:#243059;--bub-u-line:#3a4a7a;--bub-u-fg:#eaf0ff;
  --field:#131d33;--field-line:#3a4a75;--chip:#131d34;
}
body[data-theme="pact"]{
  --bg:#0d1520;--panel:#25303f;--panel2:#18212e;--line:#3a4757;--ink:#eef4fa;--dim:#a8b6c6;
  --acc:#4ecdc4;--hdr:#131b26;--ftr:#131b26;--seam:#4a5b6e;
  --bub-a:#1d2735;--bub-a-line:#ffffff1f;--bub-u:#2b4152;--bub-u-line:#4a6a80;--bub-u-fg:#f2f8fc;
  --field:#1e2937;--field-line:#4a5b6e;--chip:#1c2634;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;display:flex;height:100vh;overflow:hidden}
/* ---------- control rail ---------- */
#rail{width:300px;flex:0 0 300px;border-right:1px solid var(--line);background:var(--panel2);overflow-y:auto;padding:12px}
#rail h1{font-size:14px;margin:0 0 2px}
#rail .sub{color:var(--dim);font-size:11px;margin:0 0 12px}
.grp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:9px;background:#0b1120}
.grp>b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin-bottom:6px}
.row{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap}
button{background:#16203a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font:inherit;font-size:11.5px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#1a0b2e;border-color:var(--acc);font-weight:700}
input[type=range]{width:100%}
label{font-size:11.5px;color:var(--dim);display:flex;gap:5px;align-items:center;cursor:pointer}
#metrics{font:11px ui-monospace,Consolas,monospace;color:var(--dim);white-space:pre-wrap;background:#080d1a;border:1px solid var(--line);border-radius:6px;padding:7px;line-height:1.55}
#metrics b{color:var(--ok)}
/* ---------- stage ---------- */
#stage{flex:1;min-width:0;display:flex;align-items:stretch;justify-content:center;padding:18px;overflow:hidden}
#shell{width:100%;max-width:960px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 40px #0006}
/* ===== THE THREE REGIONS. The boundaries are the point — 1px rule + a background TONE STEP so you can
   always see where a region ends, even mid-scroll. This is spec invariant I3. ===== */
.rg-header{flex:0 0 auto;background:var(--hdr);border-bottom:1px solid var(--seam);box-shadow:inset 0 -1px 0 #ffffff0f, 0 3px 8px -3px #000a}
.rg-core{flex:1 1 auto;min-height:0;overflow-y:auto;background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
/* ---- ONE scrollbar treatment, shared by EVERY scrolling surface in the shell ----------------
   The transcript used the browser default while the type box got a different one, so the two sat at
   different widths, different colours and different insets. Same rule for both: thin, rounded, inset
   inside the rounded container, transparent track so it reads as part of the chat graphic rather than
   a browser chrome bar bolted on the edge. Firefox gets the same via scrollbar-width/color. */
.rg-core, #typebox, .popbox, .histlist, #rail{scrollbar-width:thin;scrollbar-color:#3a4870 transparent}
.rg-core::-webkit-scrollbar, #typebox::-webkit-scrollbar, .popbox::-webkit-scrollbar,
.histlist::-webkit-scrollbar, #rail::-webkit-scrollbar{width:10px;height:10px}
.rg-core::-webkit-scrollbar-track, #typebox::-webkit-scrollbar-track, .popbox::-webkit-scrollbar-track,
.histlist::-webkit-scrollbar-track, #rail::-webkit-scrollbar-track{background:transparent}
.rg-core::-webkit-scrollbar-thumb, #typebox::-webkit-scrollbar-thumb, .popbox::-webkit-scrollbar-thumb,
.histlist::-webkit-scrollbar-thumb, #rail::-webkit-scrollbar-thumb{
  background:#3a4870;border-radius:99px;border:3px solid transparent;background-clip:content-box}
.rg-core::-webkit-scrollbar-thumb:hover, #typebox::-webkit-scrollbar-thumb:hover{background:#55689c;background-clip:content-box}
.rg-core::-webkit-scrollbar-corner, #typebox::-webkit-scrollbar-corner{background:transparent}
.rg-footer{flex:0 0 auto;background:var(--ftr);border-top:1px solid var(--seam);box-shadow:inset 0 1px 0 #ffffff0f, 0 -3px 8px -3px #000a}
/* Debug amplifier only. The regions must already be obvious with this OFF — if they are not, the
   tone step above is wrong and THAT is the bug, rather than something a debug outline should paper over. */
body.showbounds .rg-header{border-bottom-color:var(--warn)}
body.showbounds .rg-footer{border-top-color:var(--warn)}
body.showbounds .rg-core{outline:1px dashed #3ddc9755;outline-offset:-2px}
body.showbounds .rg-header::after,body.showbounds .rg-footer::after{content:attr(data-rg);position:absolute;right:6px;font:700 9px/1 sans-serif;letter-spacing:1px;color:var(--warn);opacity:.85}
.rg-header,.rg-footer{position:relative}
.rg-core.--gone{display:none}
/* header innards — MAX 3 rows, transient status is a CHIP not a row */
.hrow{display:flex;align-items:center;gap:6px;padding:6px 9px;min-height:32px;flex-wrap:nowrap;overflow:hidden}
.hrow+.hrow{border-top:1px solid #ffffff0d}
/* Conversation medallions and header chips are the SAME construction — same height, padding, radius,
   border and font. Only their LENGTH may differ. Previously a tab was 3px/14px and a chip 2px/11px, so
   the two rows sat at different heights and the header jumped between workspaces. */
.tab,.hrow.--r1 .chip,.hrow.--r1 .bulb{height:22px;padding:0 10px;border-radius:11px;background:var(--chip);
  border:1px solid var(--line);font-size:11.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.tab.--act{border-color:var(--acc);color:#fff}
.tab .star{color:var(--warn);font-size:11px}
.chip{padding:2px 8px;border-radius:11px;background:var(--chip);border:1px solid var(--line);font-size:11px;color:var(--dim);white-space:nowrap}
.chip.--ok{color:var(--ok);border-color:#3ddc9744}
.chip.--acc{color:var(--acc);border-color:#c77dff44}
/* Live / Held — whether the view is pinned to the newest turn or holding your scroll position. */
.bulb{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:11px;font-size:11px;font-weight:600;border:1px solid}
.bulb.--live{color:var(--ok);border-color:#3ddc9755;background:#0d1d18}
.bulb.--held{color:var(--warn);border-color:#ffb45455;background:#1d1710}
.bulb i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
/* per-answer actions — bookmark + share, revealed on hover, always reachable by keyboard */
.msg{position:relative}
.msg.--flash{outline:2px solid var(--acc);outline-offset:2px;transition:outline-color .5s}
#jumpmsg{display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;
  background:#2a1c0b;border:1px solid var(--warn);color:var(--warn);padding:6px 12px;border-radius:8px;font-size:12px}
.msgacts{position:absolute;top:4px;right:6px;display:flex;gap:3px;opacity:0;transition:opacity .12s}
.msg:hover .msgacts,.msgacts:focus-within{opacity:1}
.msgacts button{padding:1px 6px;font-size:11px;line-height:1.4;background:#0f1730}
.msgacts button.--on{color:var(--warn);border-color:var(--warn)}
.spacer{flex:1}
.roll{display:flex;align-items:center;gap:8px;margin:0 9px 6px;padding:5px 9px;border-radius:7px;background:var(--chip);border:1px solid var(--line);font-size:11px;flex-wrap:wrap}
.roll.--warn{border-color:#ffb45455;background:#1e1a10}
.roll.--err{border-color:#ff6b8155;background:#1e1116}
.roll .m{color:var(--dim);white-space:nowrap}
.roll .m b{color:var(--ink)}
.roll .bar{flex:1;min-width:70px;height:6px;border-radius:3px;background:#0a1020;overflow:hidden;border:1px solid var(--line)}
.roll .bar i{display:block;height:100%;background:var(--ok)}
.roll.--warn .bar i{background:var(--warn)} .roll.--err .bar i{background:var(--err)}
button:disabled{opacity:.4;cursor:not-allowed}
.pop{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:60}
.pop.--open{display:flex}
.popbox{width:460px;max-height:76vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pophd{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;font-weight:600}
.popbody{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.kv{display:flex;gap:8px;font-size:12px}.kv .k{color:var(--dim);flex:1}.kv .v{font-weight:600}
.ctxrow{display:flex;align-items:center;gap:7px;font-size:12px}
.ctxsw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.cue{margin:0 9px 6px;padding:6px 9px;border-radius:7px;background:#1b1330;border:1px solid #c77dff44;font-size:11.5px;color:#e3d3ff}
/* core innards */
.msg{padding:7px 10px;border-radius:8px;font-size:12.5px;max-width:88%}
.msg.--u{background:var(--bub-u);border:1px solid var(--bub-u-line);color:var(--bub-u-fg);align-self:flex-end}
.msg.--a{background:var(--bub-a);border:1px solid var(--bub-a-line);align-self:flex-start}
/* P#/R# tags EXACTLY as production renders them (styles.css .ws-num / .pc-num): a corner pill that
   overlaps the bubble's top edge — R on the LEFT of an answer, P on the RIGHT of a prompt. */
.num{position:absolute;top:-10px;z-index:1;font:700 11.5px ui-monospace,Consolas,monospace;line-height:1.5;
  padding:1px 7px;border-radius:8px;letter-spacing:.4px;pointer-events:none;white-space:nowrap;box-shadow:0 1px 3px #0006}
.num-r{left:6px;background:var(--tag-r-bg);color:var(--tag-r-fg)}
.num-p{right:6px;background:var(--tag-p-bg);color:var(--tag-p-fg);border:1px solid #ffffff4d}
/* the wrap line reuses the SAME two colours so R/P read the same everywhere */
.tR{color:var(--tag-r-bg);font-weight:700}
.tP{color:#7aa2ff;font-weight:700}
/* HEADER PARITY: both workspaces reserve the same header height, so switching cannot shift the layout.
   Pact fills row 1 with conversation tabs; Core fills it with an identity chip. Same box either way. */
.hrow.--r1{min-height:38px}
/* image thumbs — hover to inspect without leaving the conversation */
.imgthumb{position:relative;display:inline-flex}
.imgthumb .big{position:absolute;bottom:calc(100% + 8px);left:0;display:none;z-index:70;
  width:300px;height:190px;border-radius:10px;border:1px solid var(--seam);box-shadow:0 12px 40px #000b;
  background:repeating-linear-gradient(45deg,#223,#223 10px,#2b2b3d 10px,#2b2b3d 20px);
  align-items:center;justify-content:center;color:var(--dim);font-size:11px}
.imgthumb:hover .big,.imgthumb:focus-within .big{display:flex}
/* footer innards */
.frow{display:flex;align-items:center;gap:6px;padding:5px 9px;min-height:30px}
.frow+.frow{border-top:1px solid #ffffff0d}
.frow.--gone{display:none}
/* `--gone` is applied by JS to rows AND to inline chips/spans (#f-modelchip2, #f-imgchip, #f-meta).
   It was only ever DEFINED for .rg-core and .frow, so hiding a chip silently did nothing and the
   collapsed-state chips showed permanently alongside the very rows they stand in for. One global rule. */
.--gone{display:none !important}
/* the type box sits in a wrapper so ghost text can be overlaid exactly on top of it */
.tawrap{position:relative;width:100%}
#ghost{position:absolute;inset:0;padding:7px 9px;font:inherit;font-size:12.5px;line-height:18px;color:#8290b5;pointer-events:none;white-space:pre-wrap;overflow:hidden}
#ghost kbd{background:#1a2440;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10.5px;color:var(--dim)}
/* Stop/Send + auto-continue live in ONE bordered group, per feedback */
.sendgrp{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:3px 5px;background:var(--chip)}
.sendgrp.--auto{border-color:#3ddc9755;background:#0c1a1c}
.sendgrp .rounds{font-size:10.5px;color:var(--dim);white-space:nowrap}
.autolbl{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--dim);white-space:nowrap;cursor:pointer}
.autolbl input{margin:0}
#typebox{width:100%;resize:none;background:var(--field);color:var(--ink);border:1px solid var(--field-line);border-radius:8px;box-shadow:inset 0 1px 3px #0007;padding:7px 9px;font:inherit;font-size:12.5px;line-height:18px;outline:none;display:block}
#typebox:focus{border-color:var(--acc);box-shadow:inset 0 1px 3px #0007,0 0 0 2px #c77dff22}
.btn-send{background:var(--acc);color:#1a0b2e;font-weight:700;border-color:var(--acc)}
.btn-stop{background:#3a1720;color:#ffb3c0;border-color:#7a2b3c}
.sel{background:#0f1730;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;font-size:11.5px}
/* history popup */
#hist{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
#hist.--open{display:flex}
.histbox{width:520px;max-height:70vh;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.histhd{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:600}
.histtabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.histlist{overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.hitem{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#0f1730;font-size:12px;display:flex;gap:8px;align-items:center}
.hitem .spacer{flex:1}
.warnbar{background:#2a1c0b;border-bottom:1px solid var(--warn);color:var(--warn);font-size:11.5px;padding:5px 10px;text-align:center}
@media (max-width:820px){body{flex-direction:column}#rail{width:auto;flex:0 0 auto;max-height:42vh;border-right:none;border-bottom:1px solid var(--line)}}
</style>

<div id="rail">
  <h1>Chat Shell Lab</h1>
  <p class="sub">Mockup only — production untouched. Runs the real <code>chat-shell.js</code> maths.</p>

  <div class="grp"><b>Workspace</b>
    <div class="row"><button id="wCore" class="on">Core</button><button id="wPact">Pact</button></div>
    <div class="sub" id="wNote" style="margin:4px 0 0"></div>
  </div>

  <div class="grp"><b>Footer growth</b>
    <div class="row"><button id="expandBtn">⇕ Expand (40% → full)</button></div>
    <label><input type="checkbox" id="bounds"> Debug: amplify region boundaries</label>
    <label style="margin-top:6px"><input type="checkbox" id="fit" checked> Fit shell to available height</label>
    <input type="range" id="shellH" min="320" max="900" value="620">
  </div>

  <div class="grp"><b>Type box content</b>
    <div class="row">
      <button data-fill="0">empty</button><button data-fill="3">3 lines</button>
      <button data-fill="12">12</button><button data-fill="40">40</button><button data-fill="200">200</button>
    </div>
  </div>

  <div class="grp"><b>Simulate</b>
    <div class="row"><button id="addConv">+ conversation</button><button id="addTurns">+ 6 turns</button><button id="clearTurns">clear</button></div>
    <div class="row"><button id="agents">▸ agents running</button><button id="recon">↻ reconnected</button><button id="cue">rollup bar</button></div>
    <div class="row"><button id="liveBtn">● Live / Held</button></div>
    <div class="row"><button id="imgs">+ image strip</button><button id="histBtn">🕐 history popup</button></div>
    <div class="row"><span class="sub">Context fill (drives the wrap bar)</span></div>
    <input type="range" id="ctxr" min="1" max="99" value="66">
  </div>

  <div class="grp"><b>Live geometry</b><div id="metrics"></div></div>
</div>

<div id="jumpmsg"></div>
<div id="stage"><div id="shell"></div></div>

<div id="ctxpop" class="pop"><div class="popbox">
  <div class="pophd"><span>◐ Context breakdown</span><span class="spacer"></span><button onclick="document.getElementById('ctxpop').classList.remove('--open')">×</button></div>
  <div class="popbody" id="ctxbody"></div>
</div></div>

<div id="wrappop" class="pop"><div class="popbox">
  <div class="pophd"><span>⟳ Wrap conversation</span><span class="spacer"></span><button onclick="document.getElementById('wrappop').classList.remove('--open')">×</button></div>
  <div class="popbody" id="wrapbody"></div>
</div></div>

<div id="hist"><div class="histbox">
  <div class="histhd"><span>🕐 Conversation history</span><span class="spacer"></span><span class="chip" id="histRepo"></span><button id="histX">×</button></div>
  <div class="histtabs"><button id="hOpen" class="on">Open (2)</button><button id="hRet">Retired (5)</button></div>
  <div class="histlist" id="histList"></div>
</div></div>

<script src="/chat-shell.js"></script>
<script>
var CS = window.ChatShell;
var S = {
  kind: "core", expanded: false, prevLevel: 0,
  turns: 8, convs: [{ n: "Master", act: true }], agents: 0, recon: false, cue: true, imgs: 0,
  repo: "Claudstermind", model: "Opus 4.5", auto: true, autoN: 4,
  ctxTok: 93016, ctxMax: 1000000,
  suggest: "Continue with the next item on the list.",
  autoWrap: true, wraps: 0, live: true, bm: {},
  prompts: 138, responses: 219, images: 12, pChars: 412000, rChars: 3860000
};
var $ = function (s, r) { return (r || document).querySelector(s); };
function el(t, a, k) { var e = document.createElement(t); for (var x in (a || {})) { if (x === "class") e.className = a[x]; else if (x === "html") e.innerHTML = a[x]; else e.setAttribute(x, a[x]); } (k || []).forEach(function (c) { e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }); return e; }

function build() {
  var slots = CS.slotsFor(S.kind);
  var shell = $("#shell");
  shell.style.height = shellTargetH() + "px";
  shell.replaceChildren();

  /* ================= HEADER — fixed height, max 3 rows, transient status is a CHIP ============== */
  var hdr = el("div", { class: "rg-header", "data-rg": "HEADER" });
  var r1 = el("div", { class: "hrow --r1" });
  if (slots.header.tabs) {
    S.convs.forEach(function (c, i) {
      var kids = [c.n];
      if (i === 0) kids.unshift(el("span", { class: "star", title: "Master conversation" }, ["\u2605"]));
      r1.appendChild(el("span", { class: "tab" + (c.act ? " --act" : ""), title: i === 0 ? "Master conversation" : c.n }, kids));
    });
    r1.appendChild(el("button", { title: "new conversation" }, ["+"]));
  } else {
    r1.appendChild(el("span", { class: "chip --acc" }, ["◍ " + S.repo]));
    r1.appendChild(el("span", { class: "chip" }, ["1 active conversation"]));
  }
  r1.appendChild(el("span", { class: "spacer" }));
  // THE FIX for the wasted line: transient status is a chip here, never its own full-width row.
  if (S.recon) r1.appendChild(el("span", { class: "chip --ok" }, ["↻ caught up"]));
  if (S.agents) r1.appendChild(el("span", { class: "chip --ok" }, ["🟢".repeat(Math.min(S.agents, 5)) + " " + S.agents]));
  r1.appendChild(el("span", { class: "chip --ok" }, ["✓ Saved"]));
  hdr.appendChild(r1);

  var r2 = el("div", { class: "hrow" });
  r2.appendChild(el("span", { class: "chip --acc" }, ["◐ 66% ctx"]));
  r2.appendChild(el("span", { class: "chip" }, ["⚙ " + S.agents + " agents"]));
  r2.appendChild(el("input", { class: "sel", style: "flex:1", placeholder: "P#/R# or search archive" }));
  r2.appendChild(el("button", {}, ["Go"]));
  r2.appendChild(el("button", {}, ["⌕ Recall"]));
  hdr.appendChild(r2);
  // ROLLUP BAR — replaces the old one-line advice text. Same row, far more information: the ceilings
  // that actually drive a wrap, plus the auto tick and a manual wrap button.
  if (S.cue) {
    var wr = CS.wrapReadiness({ tokens: S.ctxTok, ceiling: S.ctxMax });
    var bar = el("div", { class: "roll --" + wr.tone });
    var awCb = el("input", { type: "checkbox", title: "Automatically wrap to a fresh window at " + Math.round(wr.autoAt * 100) + "%" });
    awCb.checked = S.autoWrap;
    awCb.onchange = function () { S.autoWrap = this.checked; render(); };
    bar.appendChild(el("label", { class: "autolbl" }, [awCb, "auto-wrap"]));
    var fill = el("i"); fill.style.width = Math.min(100, wr.pct) + "%";
    bar.appendChild(el("span", { class: "bar" }, [fill]));
    // Only ceilings that can plausibly bind (see chat-shell.js rollTriggers relevance). The 25MB byte
    // ceiling is 6-31x further away than any real context window, so it never appears.
    var tg = CS.rollTriggers({ prompts: S.prompts, responses: S.responses, bytes: S.pChars + S.rChars, tokens: S.ctxTok, ceiling: S.ctxMax });
    tg.visible.forEach(function (c) {
      if (c.id === "context") return;   // the footer already carries the context figure — don't repeat it
      bar.appendChild(el("span", { class: "chip --acc", title: "This is the ceiling that will fire the wrap" },
        ["\u25b8 " + fmt(c.now) + " / " + fmt(c.max) + " turns \u00b7 " + c.pct + "%"]));
    });
    // WHAT THE WRAP WOULD TAKE, right here — the actual question you are asking when you look at this bar.
    var sp = CS.wrapSpan({ rFrom: 1, rTo: Math.max(0, S.responses - 40), pFrom: 1, pTo: Math.max(0, S.prompts - 40) });
    bar.appendChild(el("span", { class: "m", title: "What a wrap right now would take (the last 40 turns are always kept verbatim)" },
      ["would wrap ", el("span", { class: "tR" }, ["R#1\u2013R#" + fmt(sp.r.to) + " [" + fmt(sp.r.count) + "]"]),
       " \u00b7 ", el("span", { class: "tP" }, ["P#1\u2013P#" + fmt(sp.p.to) + " [" + fmt(sp.p.count) + "]"])]));
    if (S.wraps) bar.appendChild(el("span", { class: "chip" }, ["\u27f3 " + S.wraps + " wrapped"]));
    bar.appendChild(el("span", { class: "spacer" }));
    var wbtn = el("button", { title: wr.reason }, ["\u27f3 Wrap now"]);
    wbtn.disabled = !wr.canWrapManually;
    wbtn.onclick = openWrap;
    bar.appendChild(wbtn);
    hdr.appendChild(bar);
  }
  shell.appendChild(hdr);

  /* ================= CORE — the only flexing region ============================================ */
  var core = el("div", { class: "rg-core" });
  for (var i = 0; i < S.turns; i++) {
    var u = el("div", { class: "msg --u", "data-turn": "P" + (i + 1) }, [el("span", { class: "num num-p" }, ["P#" + (i + 1)]), "A user turn."]);
    core.appendChild(u);
    var a = el("div", { class: "msg --a", "data-turn": "R" + (i + 1) });
    a.appendChild(el("span", { class: "num num-r" }, ["R#" + (i + 1)]));
    a.appendChild(el("div", {}, ["An assistant answer. ".repeat(3 + (i % 4) * 4)]));
    a.appendChild(mkMsgActs(i + 1));
    core.appendChild(a);
  }
  if (!S.turns) core.appendChild(el("div", { class: "chip" }, ["no turns — use “+ 6 turns”"]));
  shell.appendChild(core);

  /* ================= FOOTER — grows, collapses in order, Send/Stop never ======================= */
  var ftr = el("div", { class: "rg-footer", "data-rg": "FOOTER" });
  if (S.imgs) {
    var ir = el("div", { class: "frow", id: "f-img" });
    for (var j = 0; j < S.imgs; j++) {
      ir.appendChild(el("span", { class: "imgthumb", tabindex: "0" }, [
        el("span", { class: "chip" }, ["\uD83D\uDDBC shot-" + (j + 1) + ".png \u00d7"]),
        el("span", { class: "big" }, ["shot-" + (j + 1) + ".png \u2014 hover preview (full size on click)"])
      ]));
    }
    ftr.appendChild(ir);
  }
  // The pasted-image strip collapses to a single count chip rather than a whole row.
  var imgChip = el("span", { class: "chip --gone", id: "f-imgchip" }, ["\uD83D\uDDBC " + S.imgs]);

  // TYPE BOX + ghost suggestion. The old "continuation line" row is GONE: the suggested next prompt is
  // ghost text inside the box, Tab to accept. That reclaims a whole row and puts the suggestion where
  // you would actually type it.
  var taRow = el("div", { class: "frow" });
  var wrap = el("div", { class: "tawrap" });
  var ta = el("textarea", { id: "typebox", placeholder: "Message the agent\u2026 (\u2318/Ctrl+Enter to send)" });
  var ghost = el("div", { id: "ghost" });
  wrap.appendChild(ta); wrap.appendChild(ghost); taRow.appendChild(wrap); ftr.appendChild(taRow);

  // ACTION ROW: attach \u00b7 meta \u00b7 history \u2026 [ auto-continue + Stop + Send ] in ONE rectangle.
  var act = el("div", { class: "frow", id: "f-act" });
  act.appendChild(el("button", { id: "f-attach", title: "Attach" }, ["\uD83D\uDCCE"]));
  var meta = el("span", { class: "row", id: "f-meta", style: "gap:6px" });
  if (slots.footer.repoPicker) {
    var rsel = el("select", { class: "sel" });
    ["Claudstermind", "OuronetPact", "AncientHub"].forEach(function (r) { rsel.appendChild(el("option", {}, [r])); });
    rsel.value = S.repo; rsel.onchange = function () { S.repo = rsel.value; render(); };
    meta.appendChild(rsel);
  } else meta.appendChild(el("span", { class: "chip" }, ["\uD83D\uDD12 OuronetPact"]));
  meta.appendChild(el("span", { class: "chip" }, ["\u2442 main"]));
  act.appendChild(meta);
  act.appendChild(imgChip);
  act.appendChild(el("button", { id: "f-hist", title: "Conversations in THIS repository" }, ["\uD83D\uDD50"]));
  var nbm = Object.keys(S.bm).filter(function (k) { return S.bm[k]; }).length;
  act.appendChild(el("button", { id: "f-bm", title: nbm ? nbm + " bookmarked answer(s) — click to list" : "No bookmarks yet" },
    [nbm ? "\u2605 " + nbm : "\u2606"]));
  act.appendChild(el("span", { class: "chip --gone", id: "f-modelchip2" }, [S.model]));
  // The EXPAND toggle lives HERE, in the never-collapsing action row — not in the model row, which is
  // collapse step 1. It used to vanish exactly when a long prompt made you want it.
  act.appendChild(el("button", { id: "f-expand", title: "How much of the conversation the type box may take" },
    [S.expanded ? "\u21d5 40%" : "\u21d5 Full"]));
  act.appendChild(el("span", { class: "spacer" }));

  var autoCb = el("input", { type: "checkbox", id: "f-autocb" });
  if (S.auto) autoCb.setAttribute("checked", "checked");
  var grp = el("div", { class: "sendgrp" + (S.auto ? " --auto" : ""), id: "f-sendgrp" }, [
    el("label", { class: "autolbl", title: "Auto-continue: send the next prompt automatically when idle" }, [autoCb, "auto"]),
    el("span", { class: "rounds" }, [S.auto ? S.autoN + "/10" : "\u2014"]),
    el("button", { class: "btn-stop" }, ["\u25a0 Stop"]),
    el("button", { class: "btn-send" }, ["Send"])
  ]);
  autoCb.onchange = function () { S.auto = this.checked; render(); };
  act.appendChild(grp);
  ftr.appendChild(act);

  // MODEL ROW: a real selector + effort + the context readout WITH ITS CEILING + the expand toggle.
  var mb = el("div", { class: "frow", id: "f-model" });
  var msel = el("select", { class: "sel", id: "f-modelsel" });
  // CLAUDE SUBSCRIPTION ONLY, deliberately. OmniRoute is not offered in the chat box until it has been
  // tested end to end — a selectable route that might not work is worse than no route at all.
  ["Opus 4.5", "Opus 5", "Sonnet 5", "Haiku 4.5", "Fable 5.1"].forEach(function (m) { msel.appendChild(el("option", {}, [m])); });
  msel.title = "Claude subscription models only. OmniRoute is intentionally not selectable here until it is verified.";
  msel.value = S.model; msel.onchange = function () { S.model = msel.value; render(); };
  mb.appendChild(msel);
  var esel = el("select", { class: "sel" });
  ["Default effort", "low", "medium", "high", "xhigh", "max"].forEach(function (m) { esel.appendChild(el("option", {}, [m])); });
  mb.appendChild(esel);
  mb.appendChild(el("label", {}, [el("input", { type: "checkbox" }), " Fast"]));
  // THE CEILING, spelled out — "16%" alone never said 16% of what.
  var pct = Math.round(S.ctxTok / S.ctxMax * 100);
  mb.appendChild(el("span", { class: "chip --acc", id: "f-ctx", title: "Context window: " + S.ctxTok.toLocaleString() + " of " + S.ctxMax.toLocaleString() + " tokens used" },
    [S.ctxTok.toLocaleString() + " / " + (S.ctxMax / 1000) + "k tok \u00b7 " + pct + "%"]));
  ftr.appendChild(mb);
  shell.appendChild(ftr);

  $("#f-hist").onclick = openHist;
  $("#f-expand").onclick = toggleExpand;
  ta.addEventListener("input", function () { S.prevLevel = 0; layout(); });
  // Ghost suggestion: Tab accepts it. Only offered when the box is empty — never overwrites your typing.
  ta.addEventListener("keydown", function (e) {
    if (e.key === "Tab" && !ta.value && S.suggest) { e.preventDefault(); ta.value = S.suggest; S._text = ta.value; S.prevLevel = 0; layout(); }
  });
  ta.value = S._text || "";
  layout();
}

/* The ONLY place geometry is decided — by the shared pure module, from MEASURED input, not CSS luck. */
function measureFrees(ftr) {
  // v1 hardcoded these and was WRONG by ~90px, which clipped the footer. Measure what each step really
  // frees; a step that frees no row height declares 0 rather than a plausible-looking number.
  var imgRow = $("#f-img");
  return [
    { id: "imageStrip", frees: imgRow ? imgRow.offsetHeight : 0 },
    { id: "meta",       frees: 0 }
  ];
}

function layout() {
  var shell = $("#shell"), ta = $("#typebox");
  var hdr = shell.querySelector(".rg-header"), ftr = shell.querySelector(".rg-footer"), core = shell.querySelector(".rg-core");
  var lineH = 18, minTypeH = lineH + 16;

  // Un-collapse everything before measuring, or we would measure a footer that is already collapsed and
  // then "free" height that was never there — the exact class of error that clipped v1.
  ["#f-img", "#f-meta", "#f-modelchip2", "#f-imgchip"].forEach(function (sel) { var n = $(sel); if (n) n.classList.remove("--gone"); });
  $("#f-modelchip2").classList.add("--gone"); $("#f-imgchip").classList.add("--gone");

  ta.style.height = "auto"; ta.style.overflowY = "hidden";
  var contentH = Math.max(minTypeH, ta.scrollHeight);
  var footerBaseH = ftr.offsetHeight - ta.offsetHeight + minTypeH;
  var steps = measureFrees(ftr);

  var r = CS.computeShell({
    shellH: shell.clientHeight, headerH: hdr.offsetHeight, footerBaseH: footerBaseH,
    contentH: contentH, minTypeH: minTypeH, lineH: lineH,
    expanded: S.expanded, prevLevel: S.prevLevel, steps: steps
  });
  S.prevLevel = r.collapseLevel;

  ta.style.height = r.typeH + "px";
  ta.style.overflowY = r.typeScrolls ? "auto" : "hidden";
  core.classList.toggle("--gone", r.coreHidden);

  // Apply the collapse decision to WHOLE ROWS, so the freed height is real.
  // The model row is no longer collapsible (see chat-shell.js COLLAPSE_STEPS) — it stays put.
  var mr = $("#f-model"); if (mr) mr.classList.remove("--gone");
  $("#f-modelchip2").classList.add("--gone");
  var im = $("#f-img"); if (im) im.classList.toggle("--gone", !!r.collapsed.imageStrip);
  $("#f-imgchip").classList.toggle("--gone", !(r.collapsed.imageStrip && S.imgs));
  var mt = $("#f-meta"); if (mt) mt.classList.toggle("--gone", !!r.collapsed.meta);

  // Ghost suggestion, positioned exactly over the empty box.
  // The ghost overlay sits ON TOP of the textarea, so while it is showing the browser's own placeholder
  // renders underneath it and the two strings overlap into mush. Only one may be visible at a time:
  // the ghost is the more useful of the two, so it wins and the placeholder is suspended.
  var g = $("#ghost");
  if (!ta.value && S.suggest) {
    g.innerHTML = "";
    g.appendChild(document.createTextNode(S.suggest + "  "));
    var k = document.createElement("kbd"); k.textContent = "Tab"; g.appendChild(k);
    if (ta.placeholder) { ta.dataset.ph = ta.placeholder; ta.placeholder = ""; }
  } else {
    g.textContent = "";
    if (!ta.placeholder && ta.dataset.ph) ta.placeholder = ta.dataset.ph;
  }

  var used = hdr.offsetHeight + (r.coreHidden ? 0 : r.coreH) + r.footerH;
  $("#metrics").innerHTML =
    "shell      " + shell.clientHeight + "\nheader     " + hdr.offsetHeight +
    "\ncore@rest  <b>" + Math.round(r.coreAtRest) + "</b>\ncore now   <b>" + Math.round(r.coreH) + "</b>" +
    (r.coreHidden ? "  (VANISHED)" : "") +
    "\nfooter     " + Math.round(r.footerH) +
    "\nsum        " + Math.round(used) + " / " + shell.clientHeight + (used <= shell.clientHeight + 1 ? "  \u2713 fits" : "  \u2717 CLIPPED") +
    "\ntype box   <b>" + Math.round(r.typeH) + "</b> / cap " + Math.round(r.cap) +
    "\n  base cap " + Math.round(r.baseCap) + (r.capIsFloored ? "  (row-floored)" : "") +
    "\n  freed    " + r.freed + " px (measured)" + (r.freedOverPromised ? "  \u26a0 over-promised" : "") +
    "\nscrolling  " + (r.typeScrolls ? "YES \u2014 text scrolls" : "no") +
    "\ncollapse   level " + r.collapseLevel + "/" + steps.length +
    "\nSend/Stop  <b>visible</b> (invariant I5)";
}

function toggleExpand() { S.expanded = !S.expanded; S.prevLevel = 0; render(); }
function openHist() {
  var slots = CS.slotsFor(S.kind);
  $("#histRepo").textContent = S.kind === "pact" ? "🔒 OuronetPact" : S.repo;
  $("#hOpen").textContent = "Open (" + (slots.history.multi ? 2 : 1) + ")";
  var list = $("#histList"); list.replaceChildren();
  var n = $("#hOpen").classList.contains("on") ? (slots.history.multi ? 2 : 1) : 5;
  for (var i = 0; i < n; i++) {
    var it = el("div", { class: "hitem" }, [el("span", {}, [(i === 0 ? "★ " : "") + "Conversation " + (i + 1) + " — " + $("#histRepo").textContent])]);
    it.appendChild(el("span", { class: "spacer" }));
    it.appendChild(el("button", {}, ["open"]));
    list.appendChild(it);
  }
  if (!slots.history.multi && $("#hOpen").classList.contains("on")) list.appendChild(el("div", { class: "chip" }, ["Core has exactly ONE active conversation — the rest are Retired."]));
  $("#hist").classList.add("--open");
}

function fmt(n) { return Number(n || 0).toLocaleString(); }
/* Jump to R#n / P#n. Accepts "R#35", "r35", "P#12", or a bare "35" (treated as a response).
   Scrolls the turn into view and flashes it, so you can see WHERE you landed. */
function doJump(raw) {
  var m = String(raw || "").trim().match(/^([rRpP])?\s*#?\s*(\d+)$/);
  if (!m) return;                                   // not a turn ref — that is Recall's job, not Jump's
  var kind = (m[1] || "R").toUpperCase(), n = +m[2];
  var node = document.querySelector('[data-turn="' + kind + n + '"]');
  if (!node) { flashMsg("R/P #" + n + " is not in the loaded window \u2014 use Recall to reach wrapped turns."); return; }
  node.scrollIntoView({ block: "center", behavior: "smooth" });
  node.classList.add("--flash");
  setTimeout(function () { node.classList.remove("--flash"); }, 1400);
}
function flashMsg(t) { var n = $("#jumpmsg"); if (!n) return; n.textContent = t; n.style.display = "block"; setTimeout(function () { n.style.display = "none"; }, 2600); }
function fmtChars(n) { n = Number(n || 0); return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n); }
/* Bookmark + share on EVERY answer. Bookmarks are what make a long conversation navigable, so they
   belong on the turn itself, not only in a toolbar somewhere else. */
function mkMsgActs(n) {
  var bm = el("button", { class: S.bm[n] ? "--on" : "", title: S.bm[n] ? "Bookmarked — click to remove" : "Bookmark this answer" }, [S.bm[n] ? "\u2605" : "\u2606"]);
  bm.onclick = function (e) { e.stopPropagation(); S.bm[n] = !S.bm[n]; render(); };
  var sh = el("button", { title: "Copy a link to R#" + n }, ["\u2934"]);
  sh.onclick = function (e) { e.stopPropagation(); sh.textContent = "\u2713"; setTimeout(function () { sh.textContent = "\u2934"; }, 900); };
  return el("div", { class: "msgacts" }, [bm, sh]);
}

/* Context breakdown — what the ctx medallion opens. Percentages are summed from the parts so the
   slices genuinely account for the whole; "free" is shown as its own row, never implied. */
function openCtx() {
  var parts = [
    { n: "Messages", t: Math.round(S.ctxTok * 0.72), c: "#c77dff" },
    { n: "System prompt", t: Math.round(S.ctxTok * 0.06), c: "#5aa8f0" },
    { n: "Tools", t: Math.round(S.ctxTok * 0.14), c: "#3ddc97" },
    { n: "Memory files", t: Math.round(S.ctxTok * 0.08), c: "#ffb454" }
  ];
  var body = $("#ctxbody"); body.replaceChildren();
  body.appendChild(el("div", { class: "kv" }, [el("span", { class: "k" }, ["Window"]), el("span", { class: "v" }, [fmt(S.ctxMax) + " tok"])]));
  body.appendChild(el("div", { class: "kv" }, [el("span", { class: "k" }, ["Used"]), el("span", { class: "v" }, [fmt(S.ctxTok) + " tok · " + Math.round(S.ctxTok / S.ctxMax * 100) + "%"])]));
  parts.forEach(function (p) {
    var sw = el("span", { class: "ctxsw" }); sw.style.background = p.c;
    body.appendChild(el("div", { class: "ctxrow" }, [sw, el("span", { class: "k", style: "flex:1;color:var(--dim)" }, [p.n]),
      el("span", { class: "v" }, [fmt(p.t) + " tok · " + (Math.round(p.t / S.ctxTok * 1000) / 10) + "%"])]));
  });
  var free = S.ctxMax - S.ctxTok;
  var fsw = el("span", { class: "ctxsw" }); fsw.style.background = "#2a3350";
  body.appendChild(el("div", { class: "ctxrow" }, [fsw, el("span", { class: "k", style: "flex:1;color:var(--dim)" }, ["Free"]), el("span", { class: "v" }, [fmt(free) + " tok"])]));
  body.appendChild(el("div", { class: "chip" }, ["Parts account for 100.0% of what is used — free space is listed separately, never folded in."]));
  $("#ctxpop").classList.add("--open");
}

/* Wrap popup — states exactly WHAT is being wrapped before you commit, and is explicit that nothing
   is deleted and nothing is renumbered (verified against the engine: a roll only advances a marker). */
function openWrap() {
  var wr = CS.wrapReadiness({ tokens: S.ctxTok, ceiling: S.ctxMax });
  var b = $("#wrapbody"); b.replaceChildren();
  var rows = [
    ["Context being wrapped", fmt(S.ctxTok) + " tok · " + wr.pct + "% of " + fmt(S.ctxMax)],
    ["Prompts", fmt(S.prompts)], ["Responses", fmt(S.responses)], ["Images", fmt(S.images)],
    ["Characters in prompts", fmt(S.pChars)], ["Characters in responses", fmt(S.rChars)],
    ["Turn numbering after wrap", "CONTINUES — next is P#" + fmt(S.prompts + 1) + " / R#" + fmt(S.responses + 1)]
  ];
  rows.forEach(function (r) { b.appendChild(el("div", { class: "kv" }, [el("span", { class: "k" }, [r[0]]), el("span", { class: "v" }, [r[1]])])); });
  b.appendChild(el("div", { class: "chip" }, ["Nothing is deleted. The wrap starts a fresh context window; the wrapped turns stay searchable in the archive and keep their original numbers."]));
  var go = el("button", { class: "btn-send" }, ["\u27f3 Wrap now"]);
  go.onclick = function () {
    S.wraps++; S.ctxTok = Math.round(S.ctxTok * 0.12);   // a fresh window keeps only a carried summary
    $("#wrappop").classList.remove("--open"); render();
  };
  b.appendChild(el("div", { class: "row" }, [el("span", { class: "spacer" }), go]));
  $("#wrappop").classList.add("--open");
}

function render() { build(); }

/* ---- controls ---- */
$("#wCore").onclick = function () { S.kind = "core"; document.body.dataset.theme = "core"; this.classList.add("on"); $("#wPact").classList.remove("on"); document.body.dataset.theme = "core";
note(); render(); };
$("#wPact").onclick = function () { S.kind = "pact"; document.body.dataset.theme = "pact"; this.classList.add("on"); $("#wCore").classList.remove("on"); document.body.dataset.theme = "core";
note(); render(); };
function note() { $("#wNote").textContent = S.kind === "pact" ? "Pact: repo LOCKED, many tabs, continuation line on." : "Core: repo CHOSEN, one active conversation, no continuation line."; }
$("#expandBtn").onclick = toggleExpand;
$("#bounds").onchange = function () { document.body.classList.toggle("showbounds", this.checked); };
// v1 capped the slider at 900px, so on a tall screen there was always dead space below the shell and
// "max" was not actually max. The range now tracks the REAL available stage height.
function stageAvail() { var st = $("#stage"); return Math.max(320, st.clientHeight - 36); }
function shellTargetH() { var sl = $("#shellH"); return $("#fit").checked ? stageAvail() : Math.min(+sl.value, stageAvail()); }
function syncSlider() { var sl = $("#shellH"); sl.max = stageAvail(); sl.disabled = $("#fit").checked; if ($("#fit").checked) sl.value = stageAvail(); }
$("#shellH").oninput = function () { $("#shell").style.height = shellTargetH() + "px"; layout(); };
$("#fit").onchange = function () { syncSlider(); $("#shell").style.height = shellTargetH() + "px"; layout(); };
document.querySelectorAll("[data-fill]").forEach(function (b) {
  b.onclick = function () {
    var n = +b.dataset.fill;
    S._text = n ? Array.from({ length: n }, function (_, i) { return "Line " + (i + 1) + " of a long prompt that keeps going and going."; }).join("\n") : "";
    $("#typebox").value = S._text; S.prevLevel = 0; layout();
  };
});
$("#addConv").onclick = function () { S.convs.forEach(function (c) { c.act = false; }); S.convs.push({ n: "Chat " + (S.convs.length + 1), act: true }); render(); };
$("#addTurns").onclick = function () { S.turns += 6; render(); };
$("#clearTurns").onclick = function () { S.turns = 0; render(); };
$("#agents").onclick = function () { S.agents = S.agents ? 0 : 3; this.classList.toggle("on", !!S.agents); render(); };
$("#recon").onclick = function () { S.recon = !S.recon; this.classList.toggle("on", S.recon); render(); };
$("#cue").onclick = function () { S.cue = !S.cue; this.classList.toggle("on", S.cue); render(); };
$("#imgs").onclick = function () { S.imgs = S.imgs ? 0 : 3; this.classList.toggle("on", !!S.imgs); render(); };
$("#liveBtn").onclick = function () { S.live = !S.live; render(); };
$("#ctxr").oninput = function () { S.ctxTok = Math.round(S.ctxMax * this.value / 100); render(); };
$("#histBtn").onclick = openHist;
$("#histX").onclick = function () { $("#hist").classList.remove("--open"); };
$("#hOpen").onclick = function () { this.classList.add("on"); $("#hRet").classList.remove("on"); openHist(); };
$("#hRet").onclick = function () { this.classList.add("on"); $("#hOpen").classList.remove("on"); openHist(); };
window.addEventListener("resize", function () { syncSlider(); $("#shell").style.height = shellTargetH() + "px"; layout(); });
syncSlider();
/* OFF by default: what you see IS the shipping design, not a debug view of it. */
$("#cue").classList.add("on");
document.body.dataset.theme = "core";
note(); render();
</script>
