<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- App-like on a phone: pinned to the device width, no pinch/shrink zoom (you don't zoom a
       native app), content allowed under the notch (padded via env(safe-area-inset-*) in CSS). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Claudstermind — Master Map</title>
  <!-- CodeMirror 5 (vendored locally under /vendor/codemirror — NO runtime CDN). Powers the editable
       Pact IDE editor: inline folding, line numbers, find/replace, bracket matching. -->
  <link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css" />
  <link rel="stylesheet" href="/vendor/codemirror/addon/fold/foldgutter.css" />
  <link rel="stylesheet" href="/vendor/codemirror/addon/dialog/dialog.css" />
  <link rel="stylesheet" href="/vendor/codemirror/addon/search/matchesonscrollbar.css" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- Claudstermind brain mark — the generated blue circuit-brain logo (transparent). -->
  <link rel="icon" type="image/png" href="/brand/favicon.png?v=2" />
  <!-- PWA: installable to the home screen as a standalone app. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Claudstermind" />
  <link rel="apple-touch-icon" href="/brand/claudstermind-mark.png?v=2" />
</head>
<body data-theme="dark">
  <!-- The Pantheonic Header: sticky, full-chrome-width separator, up to 3 fixed levels. -->
  <header class="ph" id="ph">
    <div class="ph-inner">
      <div class="ph-l1">
        <a class="ph-name" href="#overview" title="Claudstermind — home">
          <img class="brainmark" src="/brand/claudstermind-mark.png?v=2" width="28" height="28" alt="" />
          <span>Claudstermind</span>
        </a>
        <a class="ph-ver" id="phVer" href="#admin/deploy" title="version notes">v—</a>
        <button class="ph-btn --ghost ph-back" id="phBack" hidden>◄ back</button>
        <span class="ph-spacer"></span>
        <span class="model-pill" id="modelPill">model: —</span>
        <span class="model-pill" id="genPill">—</span>
        <div class="ph-identity" id="phIdentity"></div>
        <button id="themeBtn" class="ph-btn --ghost" title="Toggle theme">◐</button>
      </div>
      <div class="ph-l2" id="phL2">
        <div class="ph-sections" id="phSections"></div>
        <a class="ph-btn --primary ph-action" id="phAction" href="#workspace">Workspace ↗</a>
      </div>
      <div class="ph-l3" id="phSubnav"></div>
    </div>
  </header>

  <main id="main">
    <section id="statbar" class="statbar"></section>
    <section id="view" class="view"></section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>

  <footer class="foot">
    <span id="legend" class="legend"></span>
  </footer>

  <!-- CodeMirror 5 core + addons (vendored). Load BEFORE the StoicSyntax mode + app.js so window.CodeMirror
       exists when they register the mode / build editors. Addon order respects deps (searchcursor + dialog
       before search; annotatescrollbar + searchcursor before matchesonscrollbar). -->
  <script src="/vendor/codemirror/lib/codemirror.js"></script>
  <script src="/vendor/codemirror/addon/fold/foldcode.js"></script>
  <script src="/vendor/codemirror/addon/fold/foldgutter.js"></script>
  <script src="/vendor/codemirror/addon/edit/matchbrackets.js"></script>
  <script src="/vendor/codemirror/addon/selection/active-line.js"></script>
  <script src="/vendor/codemirror/addon/dialog/dialog.js"></script>
  <script src="/vendor/codemirror/addon/search/searchcursor.js"></script>
  <script src="/vendor/codemirror/addon/search/search.js"></script>
  <script src="/vendor/codemirror/addon/search/jump-to-line.js"></script>
  <script src="/vendor/codemirror/addon/scroll/annotatescrollbar.js"></script>
  <script src="/vendor/codemirror/addon/search/matchesonscrollbar.js"></script>
  <!-- Pact/StoicSyntax highlighter + CM mode + minimal Markdown renderer (classic scripts → window.*), before app.js. -->
  <script src="/pact-highlight.js"></script>
  <script src="/pact-cm-mode.js"></script>
  <script src="/pact-medallion.js"></script>
  <script src="/md-mini.js"></script>
  <script src="/deploy-helpers.js"></script>
  <!-- Exocortex (Phase 2) — the GENERATED browser mirror of the pure lib/ helpers behind the context
       popover, threshold indicators, windowed transcript + jump-to-#N, the agents panel and recall.
       Classic script → window.EXO, loaded before app.js. Regenerate with
       `node dashboard/public/exocortex.gen.mjs`; lib/exocortexBundle.test.mjs fails if it is stale. -->
  <script src="/exocortex.js"></script>
  <!-- Chat Shell pure layout/wrap/reply maths (docs/work/chat-shell/spec.md) — classic script → window.ChatShell,
       same loading precedent as md-mini.js / deploy-helpers.js above. Loaded before app.js, which is the first
       real production consumer; previously only dashboard/public/chat-shell-lab.html loaded this file. -->
  <script src="/chat-shell.js"></script>
  <script src="/app.js"></script>
</body>
</html>
