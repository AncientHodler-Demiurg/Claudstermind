<!doctype html><meta charset="utf-8">
<title>Mobile Cockpit Lab — header and footer as edge panels</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- A MOCKUP of a proposed phone layout for the Core cockpit. Production is untouched: app.js is not
     loaded here and nothing here is imported by it. Same relationship the Chat Shell Lab has to the
     chat box — somewhere to look at a design at full size, on the real device, before it is wired to
     a live session.

     WHY IT EXISTS. Measured on the live dashboard at 412x915 (Chromium, mobile emulation): the pane
     header takes 191px, the footer 239px, and the CONVERSATION — the only thing you opened the app
     for — gets 284px. Under the pane sit three more control strips before the OS navigation. The
     chat box was designed for a desktop grid of panes 380-560px wide, and on a phone that grid
     becomes a stack: every row that merely wrapped on the desktop now costs a band of screen.

     THE PROPOSAL, in one sentence: the header and the footer stop being ROWS and become two EDGE
     PANELS — left for what the header said (who, where, how big), right for what the footer said
     (model, effort, permission, wrap) — revealed by thumb-reachable rails on the screen edges, so
     the transcript keeps the screen.

     It reuses mechanics this repo already has: Pact mobile's slide-in drawer with a backdrop and its
     transform transition (.pactm-drawer), its sheet dismissal, and its tap-vs-scroll disambiguation
     (onTap, app.js). ONE mechanic is new — the scroll-snap WHEEL. There is no scroll-snap anywhere
     in the repo today, and a value you change ten times a day deserves better than a native select
     popup with a 12px hit target.

     The stats chips in the left panel are built by the REAL function (ChatShell.buildStatsChips), so
     what you see there is what production would render, not a drawing of it.

     PUBLIC AFTER A DEPLOY: dashboard/public is served to anyone who reaches the domain, with no
     login (relay/server.mjs gates /api/* only). Everything on this page is invented mock content. -->
<link rel="stylesheet" href="/chat-shell/chat-shell.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#070b17;color:var(--ink);font:13.5px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
.page{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 12px 36px}
.hd{max-width:720px;text-align:center}
.hd h1{margin:0 0 4px;font-size:18px}
.hd p{margin:0 0 3px;color:var(--dim);font-size:12.5px}
.hd code{background:var(--panel-2);padding:1px 5px;border-radius:5px;font-size:11.5px}
.hd b.stamp{color:var(--ok)}
.sw{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.sw button{appearance:none;border:0;background:transparent;color:var(--dim);font:inherit;font-weight:700;font-size:12.5px;padding:7px 15px;border-radius:8px;cursor:pointer}
.sw button.on{background:color-mix(in srgb,var(--accent) 24%,transparent);color:#fff}
#readout{font:11.5px/1.6 ui-monospace,Consolas,monospace;color:var(--dim);text-align:center;min-height:34px}
#readout b{color:var(--ok)} #readout .bad{color:var(--err)}
#laberr{position:fixed;left:0;right:0;top:0;z-index:999;background:#3b0d14;color:#ffd7dc;border-bottom:1px solid var(--err);
  padding:8px 12px;font:12px ui-monospace,Consolas,monospace;display:none;white-space:pre-wrap}
/* THE DEVICE. On a desktop it is a framed 412x915 phone; on a real phone the frame dissolves and the
   mock owns the screen — the point is to test it with a thumb, not to look at a picture of it. */
.device{width:412px;height:915px;flex:0 0 auto;position:relative;overflow:hidden;background:var(--bg);
  border:10px solid #10162b;border-radius:34px;box-shadow:0 24px 60px #0006}
@media (max-width:900px),(pointer:coarse) and (max-width:1180px){
  .page{padding:0;gap:0}
  .hd,#readout{display:none}
    /* On a phone the switch joins the measurement in the lab strip at the very bottom, because every
     other corner of the screen belongs to something the mock is trying to show you. */
  .sw{position:fixed;z-index:200;left:4px;transform:scale(.72);transform-origin:bottom left;
      bottom:calc(-3px + env(safe-area-inset-bottom));border:0;background:transparent;padding:0}
  .sw button{padding:5px 12px}
  .device{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .m-stat{min-height:30px;justify-content:flex-end;padding-right:10px}
}

/* ============================== the mock ============================== */
.mob{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.m-app{flex:0 0 auto;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.m-mark{width:21px;height:21px;border-radius:6px;background:radial-gradient(circle at 30% 30%,#6ea8ff,#2b4bd8);flex:0 0 auto}
.m-app b{font-size:14px;letter-spacing:.01em}
.m-app .v{font:10.5px ui-monospace,Consolas,monospace;color:var(--dim)}
.m-sp{flex:1}
.m-app .acct{font-size:11px;color:var(--dim);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* head bar — ONE row; everything the header used to say lives in the left panel */
.m-head{flex:0 0 auto;height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);
  border-bottom:var(--seam-w) solid var(--edge)}
.m-bulb{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ok);border-radius:999px;padding:2px 8px;flex:0 0 auto;
  background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 42%,transparent)}
.m-bulb i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.m-bulb.--busy{color:var(--work);background:color-mix(in srgb,var(--work) 12%,transparent);border-color:color-mix(in srgb,var(--work) 42%,transparent)}
/* STATE MEDALLIONS, in the header where they can be seen: connected, reconnecting, agents running.
   These are the one thing a reveal must never hide — you cannot decide to open a panel about a state
   you cannot see. They scroll horizontally rather than wrap, so three of them never cost a row. */
.m-meds{flex:0 1 auto;display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;min-width:0}
.m-meds::-webkit-scrollbar{display:none}
.m-hmed{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;
  color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.m-hmed i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.m-hmed.--busy{color:var(--work);background:color-mix(in srgb,var(--work) 12%,transparent);border-color:color-mix(in srgb,var(--work) 40%,transparent)}
.m-hmed.--dim{color:var(--dim);background:var(--chip);border-color:var(--line);font-weight:400}
.m-hmed.--ok{color:var(--acc);background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.m-hmed.--fade{animation:mFade .35s ease}
@keyframes mFade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.m-hmed.--fade{animation:none}}
.m-ttl{font-weight:700;font-size:13px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.m-ctx{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);background:var(--chip);
  border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
.m-ctx b{color:var(--ink)}
.m-bar{width:32px;height:4px;border-radius:99px;background:var(--panel);overflow:hidden}
.m-bar i{display:block;height:100%;background:var(--accent)}

/* core */
/* `.rg-core` / `.rg-typebox` are the PACKAGE's scrolling surfaces (frame.css): thin, rounded, inset,
   transparent track — the treatment production's transcript and type box already use. Every scrolling
   surface on this page carries one of those classes rather than restating the values, so there is one
   scrollbar design and one place to change it. The browser default is what these exist to replace. */
.m-core{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 10px 14px;display:flex;flex-direction:column;gap:11px;
  background:var(--core-bg);overscroll-behavior:contain}
.m-turn{position:relative;border-radius:12px;padding:10px 11px;font-size:13.5px}
.m-turn.--p{background:var(--bub-u);border:1px solid var(--bub-u-line);color:var(--bub-u-fg)}
.m-turn.--r{background:var(--bub-a);border:1px solid var(--bub-a-line)}
.m-turn p{margin:0 0 7px}.m-turn p:last-child{margin:0}
.m-turn code{font:12px ui-monospace,Consolas,monospace;background:#0007;padding:1px 4px;border-radius:4px}
.m-n{position:absolute;top:-8px;font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:5px}
.m-turn.--p .m-n{right:10px;background:var(--tag-p-bg);color:var(--tag-p-fg)}
.m-turn.--r .m-n{left:10px;background:var(--tag-r-bg);color:var(--tag-r-fg)}
.m-turn.--open{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
/* the reply cue, above the type box, so a reply never looks like an ordinary message */
.m-reply{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:5px 10px;border-radius:9px;font-size:11.5px;
  background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--ink)}
.m-reply b{color:var(--acc)}.m-reply span{flex:1}
.m-reply button{appearance:none;border:0;background:transparent;color:var(--dim);font-size:15px;cursor:pointer}

/* ===== THE FOOTER, in three strips, bottom-up — the shape Pact mobile already proved:
   3. the type box, FULL WIDTH (an attach button beside it is what stole the width)
   2. a row of buttons: menu + upload left, the retractor centred under the Live medallion, and
      auto / Stop / Send right
   1. a strip glued to the nav: Conversations left, Bookmarks right, and in the middle a READ-ONLY
      readout of the model that is actually running — pull it up (or tap) for the whole right pane. */
.m-compose{position:relative;flex:0 0 auto;display:flex;background:var(--panel);padding:12px 10px 0;border-top:var(--seam-w) solid var(--edge)}
.m-box{flex:1 1 auto;min-width:0;height:40px;max-height:42vh;resize:none;overflow-y:auto;background:var(--field);
  border:1px solid var(--field-line);border-radius:12px;color:var(--ink);font:inherit;font-size:15px;line-height:1.45;padding:10px 12px}
.m-box:focus{outline:none;border-color:var(--accent)}
/* the button row. `position:relative` so the Live medallion can straddle its top edge. */
.m-btnrow{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel)}
.m-ico{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--chip);border:1px solid var(--line);color:var(--ink);font-size:17px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.m-ico:active{filter:brightness(1.25)}
.m-ico.--retract{width:64px;font-size:14px}
.m-auto{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer;flex:0 0 auto;
  height:40px;padding:0 10px;border-radius:12px;background:var(--chip);border:1px solid var(--line)}
.m-auto.on{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.m-auto .m-sw{width:34px;height:20px}.m-auto .m-sw i{width:14px;height:14px}
.m-auto.on .m-sw{background:color-mix(in srgb,var(--accent) 62%,#2b3868)}
.m-auto.on .m-sw i{transform:translateX(14px);background:#fff}
.m-snd{flex:0 0 auto;min-width:62px;height:40px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);
  color:#1b0b2a;font:inherit;font-size:17px;font-weight:800;cursor:pointer;touch-action:manipulation}
.m-snd.--busy{background:var(--work);border-color:var(--work);color:var(--work-fg);font-size:13px}
.m-stp{flex:0 0 auto;min-width:48px;height:40px;border-radius:12px;border:1px solid color-mix(in srgb,var(--work-deep) 55%,var(--line));
  background:var(--chip);color:var(--work-deep);font-size:15px;cursor:pointer}
.m-stp:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--dim)}
.m-mid{flex:1;display:flex;justify-content:center}
/* THE LIVE/HELD MEDALLION — straddling the top edge of the button row, centred over the retractor,
   deliberately shorter than the buttons so it reads as a badge rather than a control. Production
   already re-homes this exact bulb between docks (stick.dockMode); this is one more dock. */
/* THE SEAM BULB. On the desktop this sits ON the boundary between the transcript and the footer
   (components.css .seambulb, top:-11px, zero flow height) — it belongs to the core's lower edge,
   which is exactly the line it reports on. Same here: absolutely placed on the compose row's top
   border, so it costs the button row nothing and the right-hand group gets the whole width it needs. */
.m-med{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:6;height:26px;display:inline-flex;align-items:center;gap:5px;
  padding:0 10px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--panel);color:var(--ok);
  border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);white-space:nowrap}
.m-med i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.m-med.--held{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
/* strip 1 — riser tabs glued to the nav below, exactly like .ws-mbtn/.pactm-mbtn do today */
.m-risers{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding:4px 6px 0;background:var(--bg)}
/* EQUAL AND MINIMAL. Conversations and Marks are the same control in two directions — which chat,
   and which mark inside it — so they get the SAME width, and that width is the smaller of what fits
   both: measured after render (fitRisers) rather than guessed at a round number, so neither label is
   clipped and no pixel is spent past the wider of the two. Everything left over is the model strip's,
   because that is the one that has something to say. */
.m-riser{flex:0 0 auto;justify-content:center;height:22px;padding:0 9px;display:inline-flex;align-items:center;gap:4px;border-radius:8px 8px 0 0;
  border:1px solid color-mix(in srgb,var(--accent) 48%,var(--line));border-bottom:none;background:color-mix(in srgb,var(--accent) 13%,var(--panel));
  color:var(--accent);font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.m-riser.--bm{color:#fbbf24;border-color:color-mix(in srgb,#fbbf24 45%,var(--line));background:color-mix(in srgb,#fbbf24 11%,var(--panel))}
/* the middle of that strip: what is RUNNING, not what is selected. Read-only on purpose — the
   selector lives in the right pane, and this said "Opus 5" next to a dropdown saying "Opus 5" for
   long enough to make the difference invisible. */
.m-running{flex:1 1 auto;min-width:0;height:26px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  border-radius:9px 9px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--panel);
  color:var(--ink);font-size:11px;font-weight:700;touch-action:manipulation}
.m-running em{font-style:normal;color:var(--dim);font-weight:400}
.m-running .m-pull{color:var(--dim);font-size:9px;letter-spacing:.2em}
.m-running:active{background:color-mix(in srgb,var(--accent) 16%,var(--panel))}

/* ===== SHEETS AND THE CONTEXT OVERLAY =====
   A sheet is the same primitive Pact mobile already uses (openSheet/closeSheet): a panel anchored to
   the bottom over a backdrop, dismissed by the ✕ or the backdrop. The context breakdown is not a
   sheet — it takes the WHOLE page, because it is the one readout you open to study rather than to
   glance at. */
.m-sheet{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end}
.m-sheet-back{position:absolute;inset:0;background:#000a}
.m-sheet-panel{position:relative;max-height:88%;display:flex;flex-direction:column;background:var(--panel);
  border-top:1px solid var(--line);border-radius:15px 15px 0 0;box-shadow:0 -8px 28px #0008}
.m-sheet-hd{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;height:46px;border-bottom:1px solid var(--line)}
.m-sheet-hd b{flex:1;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.m-sheet-grip{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:42px;height:4px;border-radius:99px;background:var(--line)}
.m-sheet-body{flex:1 1 auto;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.m-over{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;background:var(--bg)}
.m-over-hd{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.m-over-hd b{flex:1;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.m-over-body{flex:1 1 auto;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
/* the stacked context bar: one row, each slice a real share of the window */
.m-ctxbar{display:flex;height:22px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--field)}
.m-ctxbar i{display:block;height:100%;min-width:2px}   /* a 0.1% slice still has to be visible to be a slice */
.m-ctxrow{display:flex;align-items:center;gap:9px;min-height:38px;padding:4px 10px;border-radius:10px;background:var(--chip);
  border:1px solid var(--line);font-size:12.5px}
.m-ctxrow u{width:10px;height:10px;border-radius:3px;flex:0 0 auto;text-decoration:none}
.m-ctxrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-ctxrow em{font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums}
/* a search field, for any list long enough to need one */
.m-find{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.m-find input{flex:1;min-width:0;height:38px;border-radius:10px;background:var(--field);border:1px solid var(--field-line);
  color:var(--ink);font:inherit;font-size:14px;padding:0 12px}
.m-find input:focus{outline:none;border-color:var(--accent)}
.m-find b{font-size:10.5px;color:var(--dim);font-weight:400;flex:0 0 auto}
/* a list that is allowed to grow past the panel gets its own scroll, with the package's scrollbar */
.m-list{max-height:232px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
/* BUBBLE ACTIONS. Four per bubble, permanently, is 22px x every turn on a phone — so they are one tap
   away instead: tapping a bubble reveals its own row, and only one is open at a time. */
.m-acts{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;padding-top:7px;border-top:1px solid #ffffff12}
.m-act{min-width:34px;height:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  border-radius:9px;background:var(--chip);border:1px solid var(--line);color:var(--dim);font-size:13px;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.m-act:active{filter:brightness(1.3)}
.m-act.--on{color:#fbbf24;border-color:#fbbf2455}
/* THE LOW ZONE — compose + buttons. The rails hang off its TOP edge: that edge is the seam between
   the transcript and the footer, so a rail centred on it (translateY(-50%), the same trick the bulb
   uses) straddles the boundary rather than belonging to either side.
   AND THEY RESERVE NOTHING. The zone has no side padding for them; they are drawn OVER its corners,
   which are the emptiest pixels on the screen — the type box's rounded ends and the gap beside the
   outermost button. Reserving 24px each side to keep them clear was 48px taken from the field you
   type into, to protect two corners that had nothing in them. */
.m-low{position:relative;flex:0 0 auto;display:flex;flex-direction:column}

/* the repository chooser: one card per organisation, the same reading order the Overview uses */
.m-org{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.m-org-hd{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.m-org-hd i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:block}
.m-org-hd b{flex:1;font-size:12.5px}
.m-org-hd em{font-style:normal;font-size:10.5px;color:var(--dim)}
.m-org-body{display:flex;flex-direction:column}
.m-repo{display:flex;align-items:center;gap:9px;min-height:42px;padding:6px 11px;font-size:13px;cursor:pointer;
  border-top:1px solid #ffffff0d}
.m-repo:first-child{border-top:0}
.m-repo.--on{background:color-mix(in srgb,var(--accent) 13%,transparent);color:#fff}
.m-repo span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-kind{text-decoration:none;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;flex:0 0 auto;
  border:1px solid var(--line);color:var(--dim);background:var(--chip)}
.m-kind.--constructor{color:#c084fc;border-color:#c084fc55}
.m-kind.--automaton{color:#f472b6;border-color:#f472b655}
.m-kind.--daimon{color:#fbbf24;border-color:#fbbf2455}
.m-kind.--seer{color:#38bdf8;border-color:#38bdf855}
.m-kind.--website{color:#22d3ee;border-color:#22d3ee55}
.m-kind.--orchestrator{color:#f0abfc;border-color:#f0abfc55}

/* a history row: what it was, when, its first prompt, and whether resuming it rebuilds a worktree */
.m-hist{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:11px;background:var(--chip);border:1px solid var(--line)}
.m-hist.--gone{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.m-hist-1{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.m-hist-1 span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-hist-1 em{font-style:normal;font-size:11px;font-weight:400;color:var(--dim)}

  node.addEventListener("touchmove", function (e) { var y = e.touches[0] ? e.touches[0].clientY : y0; if (Math.abs(y - y0) > 8) moved = true; }, { passive: true });
  node.addEventListener("touchend", function (e) { if (moved) return; e.preventDefault(); fn(e); });
}

/* ---------------- the wheel ----------------
   Returns the element; `onPick` fires with the value that settles under the band. */
function wheel(label, options, value, onPick) {
  var opts = options.map(function (v) { return el("div", { class: "m-opt" + (v === value ? " on" : "") }, [v]); });
  var view = el("div", { class: "m-view" }, [el("div", { class: "m-pad" }, [])].concat(opts, [el("div", { class: "m-pad" }, [])]));
  var box = el("div", { class: "m-wheel" }, [el("b", {}, [label]), view, el("div", { class: "m-band" }, [])]);
  var centreOn = function (o, smooth) { view.scrollTo({ top: o.offsetTop - (view.clientHeight - o.offsetHeight) / 2, behavior: smooth ? "smooth" : "auto" }); };
  var mark = function () {
    var mid = view.scrollTop + view.clientHeight / 2, best = null, bd = 1e9;
    opts.forEach(function (o) { var d = Math.abs(o.offsetTop + o.offsetHeight / 2 - mid); if (d < bd) { bd = d; best = o; } });
    opts.forEach(function (o) { o.classList.toggle("on", o === best); });
    return best;
  };
  var settle = null;
  view.addEventListener("scroll", function () {
    var best = mark();
    clearTimeout(settle);
    settle = setTimeout(function () { if (best) onPick(best.textContent); }, 90);
  }, { passive: true });
  opts.forEach(function (o) { onTap(o, function () { centreOn(o, true); }); });
  requestAnimationFrame(function () { var cur = opts[Math.max(0, options.indexOf(value))]; if (cur) centreOn(cur, false); mark(); });
  return box;
}

/* HISTORY — every conversation that has ever existed, which is a different question from "which of
   this repository's conversations do I want open" (that is the left pane, level 2). It is its own
   page because it carries what a list of open chats does not: a SEARCH across archived turns, a
   SCOPE (this repository or all of them), and the difference between OPEN and RESUME — a conversation
   whose worktree is gone can still be resumed, and has to say so before you pick it. */
function historyOverlay() {
  var x = el("button", { class: "m-px", type: "button" }, ["✕"]);
  onTap(x, function () { setOverlay(null); });

  var count = el("b", {}, [""]);
  var input = el("input", { type: "search", placeholder: "Search conversations and archived turns…", autocomplete: "off" }, []);
  var scopeBtn = function (label, on, fn) {

  };
  var paint = function () {
    var q = String(input.value || "").trim().toLowerCase();
    var rows = S.history.filter(function (h) {
      if (S.histScope === "repo" && h.repo !== S.repo) return false;
      return !q || (h.name + " " + h.first + " " + h.repo).toLowerCase().indexOf(q) >= 0;
    });
    count.textContent = rows.length + " of " + S.history.length;
    body.replaceChildren(

        scopeBtn("This repository", S.histScope === "repo", function () { S.histScope = "repo"; paint(); }),
        scopeBtn("All repositories", S.histScope === "all", function () { S.histScope = "all"; paint(); })
      ]),
      el("div", { class: "m-sec" }, rows.length ? rows.map(function (h) {
        var r = el("div", { class: "m-hist" + (h.gone ? " --gone" : "") }, [

          el("div", { class: "m-hist-2" }, [h.first]),

          el("div", { class: "m-btns" }, [
            el("button", { class: "m-btn", type: "button" }, [h.gone ? "Open read-only" : "Open"]),
            el("button", { class: "m-btn --acc", type: "button" }, ["Resume here"])])
        ].filter(Boolean));
        return r;
      }) : [el("div", { class: "m-row" }, [el("span", {}, ["Nothing matches."])])])
    );
  };
  input.addEventListener("input", paint);
  paint();
  return el("div", { class: "m-over" }, [
    el("div", { class: "m-over-hd" }, [el("b", {}, ["History"]), x]),
    el("div", { class: "m-find" }, [input, count]),
    body

}

/* THE REPOSITORY CHOOSER — the whole page, grouped by ORGANISATION exactly as the Overview groups
   them, because that grouping is how this workspace is actually organised and a phone has no room to
   invent a second one. Picking a repository moves this chat box to that repository's ★ main
   conversation. */
function repoOverlay() {
  var x = el("button", { class: "m-px", type: "button" }, ["✕"]);
  onTap(x, function () { setOverlay(null); });
  var body = el("div", { class: "m-over-body rg-core" }, []);
  var count = el("b", {}, [""]);
  var input = el("input", { type: "search", placeholder: "Filter repositories…", autocomplete: "off" }, []);
  /* FILTER, not search-and-jump: it narrows the same grouped list in place, so the grouping you are
     learning to read stays put. An organisation with no match disappears rather than showing an
     empty card. */
  var paint = function () {
    var q = String(input.value || "").trim().toLowerCase();
    var shown = 0;
    var groups = S.orgs.map(function (o) {
      var hits = o.repos.filter(function (r) {
        return !q || (o.name + " " + r.name + " " + r.path + " " + r.kind).toLowerCase().indexOf(q) >= 0;
      });
      shown += hits.length;
      if (!hits.length) return null;
      return el("div", { class: "m-org" }, [
        el("div", { class: "m-org-hd" }, [el("i", { style: "background:" + o.col }, []), el("b", {}, [o.name]),
          el("em", {}, [o.scope || ""])]),
        el("div", { class: "m-org-body" }, hits.map(function (r) {
          var row = el("div", { class: "m-repo" + (r.path === S.repo ? " --on" : "") }, [
            el("span", {}, [r.name]), el("u", { class: "m-kind --" + r.kind }, [r.kind])]);
          onTap(row, function () {
            S.repo = r.path;
            var main = S.convos.filter(function (c) { return c.repo === r.path && c.star; })[0];
            S.convo = { name: main ? main.name : r.name + " · Main", star: true };
            S.worktree = main ? main.tree : "main";
            S.convos.forEach(function (c) { c.on = !!(main && c === main); });
            setOverlay(null);
          });
          return row;
        }))
      ]);
    }).filter(Boolean);
    count.textContent = shown + " of " + S.orgs.reduce(function (a, o) { return a + o.repos.length; }, 0);
    body.replaceChildren.apply(body, groups.length ? groups
      : [el("div", { class: "m-row" }, [el("span", {}, ["Nothing matches “" + q + "”."])])]);
  };
  input.addEventListener("input", paint);
  paint();
  return el("div", { class: "m-over" }, [
    el("div", { class: "m-over-hd" }, [el("b", {}, ["Repositories"]), x]),
    el("div", { class: "m-find" }, [input, count]),
    body
  ]);
}

function leftPanel() {

     stacked instead of laid out in a row. */
  /* ONE repository — the one this chat box is on — and ONE button to change it. A list of thirty
     repositories is not a section of a panel; it is its own page, grouped the way the Overview groups
     them, which is what the button opens. */
  var repoNow = el("div", { class: "m-row --on" }, [el("span", {}, [S.repo]), el("em", {}, ["current"])]);
  var repoBtn = el("button", { class: "m-btn --acc", type: "button" }, ["⇄ Change repository"]);
  onTap(repoBtn, function () { setPanel(null); setOverlay("repos"); });

  var mine = S.convos.filter(function (c) { return c.repo === S.repo; });

    el("div", { class: "m-phd" }, [el("b", {}, ["This chat"]), (function () {
      var x = el("button", { class: "m-px", type: "button" }, ["✕"]); onTap(x, function () { setPanel(null); }); return x;
    })()]),
    el("div", { class: "m-pbody rg-core" }, [

      section("2 · Conversations in " + S.repo.split("/").pop(), convoBlock),
      section("History", [(function () {
        var b = el("div", { class: "m-row" }, [el("span", {}, ["🕐 All conversations"]),
          el("em", {}, [S.history.length + " · searchable"])]);
        onTap(b, function () { setPanel(null); setOverlay("history"); });
        return b;
      })()]),

        el("div", { class: "m-btns" }, [el("button", { class: "m-btn", type: "button" }, ["Select worktree"]),

function turns() {
  /* PER-BUBBLE ACTIONS — copy, reply, share, star. Four buttons on every bubble, permanently, is
     ~30px times every turn on a phone, so they are one tap away instead: tapping a bubble opens its
     own row and closes whichever was open before. `copy` is the one this exists for — showing another
     agent what this one said — so it is first and it reports back when it has taken the text. */
  return S.turns.map(function (t) {
    var addr = (t.role === "user" ? "P#" : "R#") + t.n;
    var p = el("p", {}, []);
    p.innerHTML = t.text;
    var kids = [el("span", { class: "m-n" }, [addr]), p];
    if (S.openTurn === t.n) {
      var act = function (label, title, fn, on) {
        var b = el("button", { class: "m-act" + (on ? " --on" : ""), type: "button", title: title }, [label]);
        onTap(b, function (e) { if (e && e.stopPropagation) e.stopPropagation(); fn(b); });
        return b;

          b.textContent = "✓"; setTimeout(function () { b.textContent = "⧉"; }, 900);
        }),
        act("↩", "Reply to this turn", function () { S.replyTo = addr; render(); }),
        act("⤴", "Share — hand this turn to another agent as " + addr, function (b) {
          try { navigator.clipboard.writeText(S.repo.split("/").pop() + "#" + addr.replace("#", "")); } catch (e) {}
          b.textContent = "✓"; setTimeout(function () { b.textContent = "⤴"; }, 900);
        }),

          var i = S.marks.map(function (m) { return m.at; }).indexOf(addr);
          if (i >= 0) S.marks.splice(i, 1); else S.marks.unshift({ at: addr, note: "marked", kind: t.role === "user" ? "p" : "r" });
          render();

    onTap(bub, function () { S.openTurn = S.openTurn === t.n ? null : t.n; render(); });

  var ctx = el("div", { class: "m-ctx" }, [el("div", { class: "m-bar" }, [el("i", { style: "width:" + ctxPct() + "%" }, [])]), el("b", {}, [ctxPct() + "%"])]);
  onTap(ctx, function () { setOverlay("context"); });
  /* ONE medallion, not three. Five things on a 40px row is crowding, and the three state chips were
     not equal citizens:
       · CONNECTION is a state, and the only one that must always be legible → it stays, alone.
       · AGENTS RUNNING is a count with a destination — the right pane lists them — so it moves onto
         the rail that opens that pane, where it is both the number and the reason to press.
       · RECONNECTED is an EVENT, not a state. A permanent ↻ reads as a reload button (it was read as
         one), and a thing that has finished happening does not deserve a permanent chip: it says so
         in words for a few seconds and then gets out of the way.
     Nothing is lost — the sentence behind each is one tap away in the pane that owns it. */
  var meds = [el("span", { class: "m-hmed" + (S.busy ? " --busy" : "") }, [el("i", {}, []), S.busy ? "Working" : "Live"])];
  if (S.reconnected) meds.push(el("span", { class: "m-hmed --ok --fade" }, ["↻ caught up"]));
  var medBar = el("span", { class: "m-meds" }, meds);
  onTap(medBar, function () { setPanel("left"); });   // the full sentence lives in the left pane
  var title = el("span", { class: "m-ttl" }, [S.convo.star ? "★ " : "", S.convo.name]);
  onTap(title, function () { setPanel("left"); });
  var head = el("div", { class: "m-head" }, [title, medBar, ctx]);

  /* 3. THE TYPE BOX — full width. An attach button beside it is exactly what made the field narrow. */
  var box = el("textarea", { class: "m-box rg-typebox", rows: "1", placeholder: "Message Claude…" }, []);
  var grow = function () {
    box.style.height = "40px";
    var cap = Math.round(0.40 * (document.querySelector(".device") || { clientHeight: 915 }).clientHeight);
    box.style.height = Math.min(box.scrollHeight, cap) + "px";
    /* PUSH, DON'T COVER: the core is the only flexing region, so a taller box shrinks it — but the
       transcript then has to be re-pinned or the bottom slides out of view, which is what reads as
       "it went over the chat". Same stick-to-bottom rule production's transcript already has. */
    if (S.stick) core.scrollTop = core.scrollHeight;   // …but only while the bulb says Live
    measure();
  };
  box.addEventListener("input", grow);

  /* 2. THE BUTTON ROW — menu + upload left, retractor centred under the medallion, auto/Stop/Send right. */
  /* NO ☰. On the desktop it opens the tree column; here the tree column IS the repository chooser,
     which the left pane already reaches with one button — and the left pane itself is reachable from
     its rail and from the Chats riser. Three doors to one room, in a row where every slot is width
     taken from Send. */
  var upB = el("button", { class: "m-ico", type: "button", title: "Attach" }, ["📎"]);
  var autoB = el("div", { class: "m-auto" + (S.autoContinue ? " on" : "") }, [el("div", { class: "m-sw" }, [el("i", {}, [])]), "auto"]);
  onTap(autoB, function () { S.autoContinue = !S.autoContinue; render(); });
  /* Stop ALWAYS occupies its slot and switches enabled/disabled, exactly as it does on the desktop:
     a button that appears and vanishes makes Send jump sideways under your thumb the moment a turn
     starts or ends, which is how you press the wrong one. */
  var stopB = el("button", { class: "m-stp", type: "button", title: "Stop" }, ["■"]);
  stopB.disabled = !S.busy;
  if (!S.busy) stopB.setAttribute("aria-disabled", "true");
  onTap(stopB, function () { if (S.busy) { S.busy = false; render(); } });
  var send = el("button", { class: "m-snd" + (S.busy ? " --busy" : ""), type: "button" }, [S.busy ? "…" : "➤"]);
  onTap(send, function () { S.busy = !S.busy; render(); });
  /* THE STICK BULB. Not the turn state — the SCROLL state: "Live" means the transcript is pinned to
     the bottom and new turns push into view; "Held" means you scrolled up and it is staying put.
     Tapping it returns to the bottom and re-arms Live, which is what production's bulb does. */
  var med = el("span", { class: "m-med" + (S.stick ? "" : " --held") }, [el("i", {}, []), S.stick ? "⇣ Live" : "⏸ Held"]);
  onTap(med, function () { S.stick = true; core.scrollTop = core.scrollHeight; render(); });
  core.addEventListener("scroll", function () {
    var atEnd = core.scrollHeight - core.scrollTop - core.clientHeight < 24;
    if (atEnd !== S.stick) { S.stick = atEnd; med.className = "m-med" + (atEnd ? "" : " --held"); med.textContent = atEnd ? "⇣ Live" : "⏸ Held"; }
  }, { passive: true });
  /* The expansion button is gone: the box already grows with what you type, and a control that
     duplicates what the box does anyway was the odd one out in this row. What is left in the middle
     is the Live/Held bulb, which is a STATE and belongs where the eye already goes. */
  /* Menu and upload left; auto, Stop and Send right with the whole remaining width to sit in. The
     middle is empty on purpose now — the bulb it used to hold moved up onto the core's own edge. */
  var btnrow = el("div", { class: "m-btnrow" }, [upB, el("div", { class: "m-mid" }, []), autoB, stopB, send]);

  /* 1. THE STRIP glued to the nav. The middle is a READOUT of what is running; pulling it up (or
     tapping it) opens the right pane, which is where the selector lives. */
  var running = el("div", { class: "m-running" }, [el("span", { class: "m-pull" }, ["▲▲"]),
    S.runningModel, el("em", {}, ["· " + S.effort.replace(" effort", "") + " · " + S.perm])]);
  onTap(running, function () { setSheet("model"); });
  (function pullUp(node) {          // a real pull, not only a tap — the gesture the ▲▲ promises
    var y0 = null;
    node.addEventListener("touchstart", function (e) { y0 = e.touches[0] ? e.touches[0].clientY : null; }, { passive: true });
    node.addEventListener("touchmove", function (e) {
      if (y0 == null) return;
      var y = e.touches[0] ? e.touches[0].clientY : y0;
      if (y0 - y > 24) { y0 = null; setSheet("model"); }
    }, { passive: true });
  })(running);
  var risers = el("div", { class: "m-risers" }, [
    (function () { var b = el("div", { class: "m-riser" }, ["💬 Chats " + S.boxes.length]); onTap(b, function () { setSheet("convos"); }); return b; })(),
    running,
    (function () { var b = el("div", { class: "m-riser --bm" }, ["★ Marks " + S.marks.length]); onTap(b, function () { setSheet("marks"); }); return b; })()
  ]);

  var scrim = el("div", { class: "m-scrim" + (S.panel ? " on" : "") }, []);
  onTap(scrim, function () { setPanel(null); });
  var reply = S.replyTo ? (function () {
    var x = el("button", { type: "button" }, ["✕"]);
    onTap(x, function () { S.replyTo = null; render(); });
    return el("div", { class: "m-reply" }, [el("b", {}, [S.replyTo]), el("span", {}, ["replying to this turn"]), x]);
  })() : null;
  var compose = el("div", { class: "m-compose" }, reply ? [med, reply, box] : [med, box]);
  if (reply) compose.style.flexDirection = "column";
  var low = el("div", { class: "m-low" }, [compose, btnrow]);
  if (S.rail !== "none") {
    var cls = " --" + S.rail;
    var railL = el("div", { class: "m-rail --l" + cls }, [el("div", { class: "m-grip" }, []), el("span", { class: "m-rlbl" }, ["Chat"])]);
    var agentN = (S.agentList || []).filter(function (a) { return a.state === "run"; }).length;
    var railR = el("div", { class: "m-rail --r" + cls + (agentN ? " --busy" : "") },
      [agentN ? el("span", { class: "m-rail-n" }, [String(agentN)]) : el("div", { class: "m-grip" }, []),
       el("span", { class: "m-rlbl" }, ["Stats"])]);
    onTap(railL, function () { setPanel("left"); });
    onTap(railR, function () { setPanel("right"); });
    low.appendChild(railL); low.appendChild(railR);
  }
  var kids = [appBar(), head, core, low, risers, nav(), el("div", { class: "m-stat" }, [])];
  kids.push(scrim, leftPanel(), rightPanel());
  if (S.sheet === "model") kids.push(modelSheet());
  else if (S.sheet === "convos") kids.push(convosSheet());
  else if (S.sheet === "marks") kids.push(marksSheet());
  if (S.overlay === "context") kids.push(contextOverlay());
  else if (S.overlay === "repos") kids.push(repoOverlay());
  else if (S.overlay === "history") kids.push(historyOverlay());
  var wrap = el("div", { class: "mob" }, kids);
  wrap.id = "mob";
  requestAnimationFrame(function () { if (S.stick) core.scrollTop = core.scrollHeight; });
  return wrap;
}

/* TODAY — the same content under the layout production ships, rebuilt at the measured heights so the
   comparison is honest: two header rows (one of them the stats chips, which wrap onto three lines),
   five footer rows, then the mobile action bar and the riser tabs. */
function today() {
  var chip = function (t, cls) { return el("span", { class: "chip " + (cls || "--far") }, [t]); };
  var hd = el("div", { class: "t-hd" }, [
    el("div", { class: "t-row --right" }, [chip("◉"), chip("Claudstermind", "--acc"), el("span", {}, ["☐ multi-chat"]),
      chip("◉ 4 agents · 4 done"), chip("↻ Reconnected — caught up"), chip("● Live", "--acc"), el("span", {}, ["✕"])]),
    el("div", { class: "t-row --right" }, Array.prototype.slice.call(chipRow().childNodes))
  ]);
  var core = el("div", { class: "m-core" }, turns());
  var ft = el("div", { class: "t-ft" }, [
    el("div", { class: "t-row" }, [el("div", { class: "t-sel" }, ["1  Message Claude…"])]),
    el("div", { class: "t-row" }, [el("span", { class: "t-b" }, ["📎"]), el("span", { class: "t-b" }, ["1 line"]),
      el("div", { class: "t-sel" }, ["Claudstermind · AncientHodler", "⌄"]), el("div", { class: "t-sel" }, ["main", "⌄"]),
      el("span", { class: "t-b" }, ["🕒"]), el("span", { class: "t-b" }, ["☆"]), el("span", { class: "t-b" }, ["↕ Full"]),
      el("span", {}, ["☐ auto"]), el("span", { class: "t-b --send" }, ["Send"])]),
    el("div", { class: "t-row" }, [el("div", { class: "t-sel" }, [S.model, "⌄"]), el("div", { class: "t-sel" }, [S.effort, "⌄"]),
      el("span", {}, ["☐ ultracode"]), chip("· running " + S.model), el("span", { class: "t-b --red" }, [S.perm, "⌄"]),
      el("span", {}, ["☑ auto-wrap"]), el("div", { class: "m-meter", style: "width:96px" }, [el("i", { style: "width:" + ctxPct() + "%" }, [])]),
      el("span", { class: "t-b" }, ["🗜 Compact"]), el("span", { class: "t-b" }, ["↺ Wrap at 60%"])])
  ]);
  var mcbar = el("div", { class: "t-mcbar" }, [el("span", { class: "t-mc" }, ["☰"]), el("span", { class: "t-mc" }, ["⚙"]),
    el("span", { class: "t-mc" }, ["📎"]), el("span", { class: "t-mc" }, ["⌃"]), el("div", { class: "m-sp" }, []),
    el("span", { class: "t-mc" }, ["↻"]), el("span", { class: "t-mc --send" }, ["➤"])]);
  var risers = el("div", { class: "t-risers" }, [el("span", { class: "t-riser" }, ["💬 Conversations [2]"]),
    el("div", { class: "t-mid" }, [el("div", { class: "t-sel", style: "flex:0 0 auto;min-width:120px" }, [S.model, "⌄"])]),
    el("span", { class: "t-riser --bm" }, ["★ Bookmarks"])]);
  var wrap = el("div", { class: "mob" }, [appBar(), hd, core, ft, mcbar, risers, nav(), el("div", { class: "m-stat" }, [])]);
  wrap.id = "mob";
  return wrap;
}

/* Both risers to the SAME width, and that width to the wider of their two natural widths — measured
   after the row exists, because a label's width is a fact about the font, not a number to pick. */
function fitRisers() {
  var rs = document.querySelectorAll(".m-riser");
  if (!rs.length) return;
  rs.forEach(function (r) { r.style.width = "auto"; });
  var w = 0;
  rs.forEach(function (r) { w = Math.max(w, r.offsetWidth); });
  rs.forEach(function (r) { r.style.width = w + "px"; });
}

/* The readout is measured from the DOM, not asserted in prose — the claim this page makes is a
   number, so the page has to keep proving it after every edit. */
function measure() {
  var dev = document.querySelector(".device"), core = document.querySelector(".m-core");
  if (!dev || !core) return;
  var H = dev.getBoundingClientRect().height, c = core.getBoundingClientRect().height;
  var pct = Math.round(c / H * 1000) / 10;
  var out = $("#readout");
  var good = pct >= 55;
  S.measured[S.view] = pct;
  var other = S.view === "today" ? "proposed" : "today";
  var chip = document.querySelector(".m-stat");
  if (chip) {
    chip.innerHTML = "chat <" + (good ? "b" : "span class=bad") + ">" + Math.round(c) + "px · " + pct + "%</" +
      (good ? "b" : "span") + ">" + (S.measured[other] != null ? " &nbsp;(" + other + ": " + S.measured[other] + "%)" : "");
    if (S.view === "proposed") {
      var cyc = el("span", { class: "m-cyc" }, ["rail: " + S.rail + " ▸"]);
      onTap(cyc, function () { var o = ["arc", "tab", "none"]; S.rail = o[(o.indexOf(S.rail) + 1) % o.length]; render(); });
      chip.appendChild(cyc);
    }
  }
  out.innerHTML = "device " + Math.round(H) + "px &nbsp;·&nbsp; transcript <" + (good ? "b" : "span class=bad") + ">" +
    Math.round(c) + "px (" + pct + "%)</" + (good ? "b" : "span") + ">" +
    "<br>" + (S.view === "today"
      ? "header 3 rows + footer 7 rows + action bar + risers &nbsp;·&nbsp; measured live: 284px / 31% at 412×915"
      : "1 head row + 1 compose row; the rest is behind the two rails");
}

function render() {
  var host = $("#mob"), next = S.view === "today" ? today() : proposed();
  host.replaceWith(next);
  document.querySelectorAll("#sw button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === S.view); });
  armReconnectFade();
  requestAnimationFrame(function () { fitRisers(); measure(); });
}

/* Wiring: the view switch, Escape closes a panel, and a swipe from either edge opens its panel —
   the gesture the rails are a visible affordance FOR. */
document.querySelectorAll("#sw button").forEach(function (b) {
  b.addEventListener("click", function () { S.view = b.dataset.v; S.panel = null; render(); });
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if (S.overlay) setOverlay(null); else if (S.sheet) setSheet(null); else if (S.panel) setPanel(null);
});
window.addEventListener("resize", function () { fitRisers(); measure(); });
(function swipes() {
  var x0 = 0, y0 = 0, live = false;
  document.addEventListener("touchstart", function (e) {
    var d = document.querySelector(".device"); if (!d) return;
    var r = d.getBoundingClientRect(), t = e.touches[0];
    x0 = t.clientX - r.left; y0 = t.clientY - r.top;
    live = y0 > 90 && y0 < r.height - 120 && (x0 < 28 || x0 > r.width - 28);
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (!live) return; live = false;
    var t = e.changedTouches[0], d = document.querySelector(".device"), r = d.getBoundingClientRect();
    var dx = (t.clientX - r.left) - x0;
    if (dx > 40 && x0 < 28) setPanel("left");
    else if (dx < -40 && x0 > r.width - 28) setPanel("right");
  }, { passive: true });
})();

/* A handle on the mock's own state, for driving it from the console (and for the screenshots that go
   into a review). Lab furniture: production has no such thing. */
/* The reconnect notice clears itself after a few seconds, which is what makes it an event rather
   than a chip you stop seeing. `LAB.reconnect()` fires another one so it can be watched. */
var reconnectTimer = null;
function armReconnectFade() {
  clearTimeout(reconnectTimer);
  if (!S.reconnected) return;
  reconnectTimer = setTimeout(function () { S.reconnected = false; render(); }, 6000);
}
window.LAB = { S: S, render: render, setPanel: setPanel, setSheet: setSheet, setOverlay: setOverlay,
  reconnect: function () { S.reconnected = true; render(); } };
document.body.dataset.theme = "core";
fetch("/api/version").then(function (r) { return r.json(); })
  .then(function (v) { S.build = v.version; $("#stamp").textContent = "build " + v.version; render(); })
  .catch(function () { $("#stamp").textContent = "build (offline)"; });
render();
</script>
